apiVersion: apps/v1
kind: Deployment
metadata:
  name: myself-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myself-app
  template:
    metadata:
      labels:
        app: myself-app
    spec:
      containers: 
        - name: myself-app
          image: embarkx/hello-python
          env: 
            - name: ENV_VALUE
              value: "Hello from app.yaml!"
          ports: 
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: myself-app
spec:
  selector:
    app: myself-app
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32003
