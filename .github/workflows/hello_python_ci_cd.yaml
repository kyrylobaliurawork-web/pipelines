name: Hello Python to AWS EKS

on: 
    push:
        branches: 
            - "main"
        # paths:
        #     - "pipelines/app1-hello/python/"
    workflow_dispatch:
        
jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.9'

            - name: Install dependencies
              working-directory: app1-hello/python
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Run tests
              working-directory: app1-hello/python
              run: python -m py_compile main.py

    docker-build-push:
        needs: build-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                context: app1-hello/python
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/app1-hello-python:latest
    deploy-to-aws-eks:
        needs: docker-build-push
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: us-east-1
            
            - name: Install eksctl
              run: |
                curl --silent --location "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" | tar xz -C /tmp
                sudo mv /tmp/eksctl /usr/local/bin

            - name: Create EKS cluster if not exists
              run: |
                if aws eks describe-cluster --name hello-eks-cluster --region us-east-1 >/dev/null 2>&1; then
                  echo "Cluster already exists, skipping creation"
                else
                  eksctl create cluster --name hello-eks-cluster --region us-east-1 --node-type t3.small --nodes 2
                fi
            
            - name: Set up kubectl
              uses: azure/setup-kubectl@v4
            
            - name: Update kubeconfig for eks cluster
              run: |
                aws eks update-kubeconfig --name hello-eks-cluster --region us-east-1
            
            - name: verify kubectl access
              run: kubectl get nodes
            
            - name: Deploy to AWS EKS   
              run: |
                kubectl apply -f app1-hello/python/k8s/deployment.yaml